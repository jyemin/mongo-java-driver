description: handshake-hello-container-env
schemaVersion: '1.27'
runOnRequirements:
  - minServerVersion: '4.4'
    auth: false
createEntities:
  - client:
      id: &client client
      useMultipleMongoses: false
      setEnvironment:
        AWS_EXECUTION_ENV: null
        AWS_LAMBDA_RUNTIME_API: null
        FUNCTIONS_WORKER_RUNTIME: null
        K_SERVICE: null
        FUNCTION_NAME: null
        VERCEL: null
        KUBERNETES_SERVICE_HOST: 10.0.0.1
      observeWireMessages:
        connections: [application]
        phases: [handshake]
  - database:
      id: &database database
      client: *client
      databaseName: handshake-test
tests:
  - description: container metadata is nested in client.env, not a sibling of it
    operations:
      - name: runCommand
        object: *database
        arguments: { commandName: ping, command: { ping: 1 } }
    expectWireMessages:
      - client: *client
        messages:
          - opcode: OP_QUERY
            responseTo: 0
            flags: []
            fullCollectionName: admin.$cmd
            numberToSkip: 0
            numberToReturn: -1
            command:
              isMaster: 1
              helloOk: true
              backpressure: "2"
              client:
                application: { name: client }
                driver:
                  name: { $$type: string }
                  version: { $$type: string }
                os:
                  type: { $$type: string }
                  name: { $$unsetOrMatches: { $$type: string } }
                  architecture: { $$unsetOrMatches: { $$type: string } }
                  version: { $$unsetOrMatches: { $$type: string } }
                platform: { $$unsetOrMatches: { $$type: string } }
                # env holds only container: every FaaS variable is unset above.
                env:
                  container:
                    orchestrator: kubernetes
                    # Set to docker iff the host has /.dockerenv, which a test cannot control.
                    runtime: { $$unsetOrMatches: docker }
