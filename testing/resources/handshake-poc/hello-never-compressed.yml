description: handshake-hello-never-compressed
schemaVersion: '1.27'
# OP_COMPRESSED.md: hello and legacy hello MUST NOT be compressed, whoever sends them and whenever.
# The monitor tests cover monitors; this covers an application sending them after the handshake.
#
# FAILS AGAINST THE JAVA DRIVER, and that is the finding: with compressors configured, an application hello and an application
# isMaster are sent as OP_COMPRESSED (zlib). InternalStreamConnection's don't-compress list has no hello or isMaster; monitors
# are safe only because their connections are built with an empty compressor list. Not fixed: this is a POC.
runOnRequirements:
  - minServerVersion: '4.4'
    auth: false
createEntities:
  - client:
      id: &client client
      useMultipleMongoses: false
      uriOptions:
        compressors: zlib
      setEnvironment:
        AWS_EXECUTION_ENV: null
        AWS_LAMBDA_RUNTIME_API: null
        FUNCTIONS_WORKER_RUNTIME: null
        K_SERVICE: null
        FUNCTION_NAME: null
        VERCEL: null
        KUBERNETES_SERVICE_HOST: null
      observeWireMessages:
        connections: [application]
        phases: [operation]
  - database:
      id: &database database
      client: *client
      databaseName: handshake-test
tests:
  - description: an application hello and an application isMaster are sent as plain OP_MSG on a client that compresses
    operations:
      - name: runCommand
        object: *database
        arguments: { commandName: hello, command: { hello: 1 } }
      - name: runCommand
        object: *database
        arguments: { commandName: isMaster, command: { isMaster: 1 } }
      # For contrast: an ordinary command on the same connection IS compressed.
      - name: runCommand
        object: *database
        arguments: { commandName: ping, command: { ping: 1 } }
    expectWireMessages:
      - client: *client
        source: application
        ignoreExtraMessages: true
        messages:
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  hello: 1
                  $db: handshake-test
                  # The implicit session and the cluster time are added by the driver; the first message precedes any cluster time.
                  lsid: { $$type: object }
                  $clusterTime: { $$unsetOrMatches: { $$type: object } }
                  $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
          - opcode: OP_MSG
            responseTo: 0
            flags: []
            sections:
              - kind: 0
                body:
                  isMaster: 1
                  $db: handshake-test
                  lsid: { $$type: object }
                  $clusterTime: { $$unsetOrMatches: { $$type: object } }
                  $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
          - opcode: OP_COMPRESSED
            responseTo: 0
            originalOpcode: OP_MSG
            compressorId: 2
            uncompressedSize: { $$type: int }
            message:
              flags: []
              sections:
                - kind: 0
                  body:
                    ping: 1
                    $db: handshake-test
                    lsid: { $$type: object }
                    $clusterTime: { $$unsetOrMatches: { $$type: object } }
                    $readPreference: { $$unsetOrMatches: { mode: primaryPreferred } }
